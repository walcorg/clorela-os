# Clorela-OS configuration, installed as /etc/clorela/clorela.conf.
# Read by clorela-ui and clorela-acqd at start-up (restart them after editing).
# Values marked [TO VERIFY] depend on the shield v4.1 hardware and must be
# confirmed on a real board before relying on them.

[storage]
database=/var/lib/clorela/measurements.db

[acquisition]
# "i2c" talks to the node(s) through the shield; "sim" uses a simulated node.
sensor=i2c
# Node I2C bus. Shield v4 wires the nodes to the hardware I2C1 pins (GPIO2/3,
# via a PCA9306 level shifter), i.e. /dev/i2c-1. [TO VERIFY] node-routine
# recommends a software bus (i2c-gpio) because the BCM2835 controller does not
# handle clock stretching; bound to GPIO2/3 it gets another bus number.
# See docs/hardware-shield-v4.md.
i2c_bus=1
# Node addresses: 0x10 + ADDR1*2 + ADDR0 (solder jumpers on the rigid PCB).
node_addresses="0x10"
# Seconds between acquisition cycles.
interval_s=60
# LEDs measured one by one in each cycle (0-7 data, 8-11 calibration).
leds="0-11"
# Acquisition requires Wi-Fi. Without it the daemon waits and the
# interface runs in restricted mode.
require_network=true
autostart=false
control_socket=/run/clorela/acqd.sock

[display]
# Status display on the shield: 0.96" 128x64 I2C OLED (SSD1306).
# "ssd1306", "console" (log only) or "none".
backend=ssd1306
# [TO VERIFY] Bus and address. The display is not in the shield v4 schematic
# yet; on the 3.3 V side of I2C1 it shares the node bus. The module selects
# 0x3C or 0x3D with a resistor on its back ("0x78/0x7A" in 8-bit notation).
i2c_bus=1
address=0x3C

[signer]
# Secure element that will sign CO2 capture receipts (Anchor Protocol).
# Only "none" exists today; "tropic01" will be added when the shield carries
# the chip. See docs/signer-tropic01.md.
backend=none

[ui]
fullscreen=true
# es, en or fr
language=es
state=/var/lib/clorela/ui.conf
