# Clorela-OS configuration, installed as /etc/clorela/clorela.conf.
# Read by clorela-ui and clorela-acqd at start-up (restart them after editing).
# Values marked [TO VERIFY] depend on the shield v4.1 hardware and must be
# confirmed on a real board before relying on them.

[storage]
database=/var/lib/clorela/measurements.db

[acquisition]
# "i2c" talks to the node(s) through the shield; "sim" uses a simulated node.
sensor=i2c
# [TO VERIFY] Bus number of the node I2C bus. node-routine recommends the
# software bus (dtoverlay=i2c-gpio) because the BCM2835 hardware I2C does not
# handle clock stretching; that bus usually gets another number (e.g. 3).
i2c_bus=1
# Node addresses: 0x10 + ADDR1*2 + ADDR0 (solder jumpers on the rigid PCB).
node_addresses="0x10"
# Seconds between acquisition cycles.
interval_s=60
# LEDs measured one by one in each cycle (0-7 data, 8-11 calibration).
leds="0-11"
# Acquisition requires Wi-Fi. Without it the daemon waits and the
# interface runs in restricted mode.
require_network=true
autostart=false
control_socket=/run/clorela/acqd.sock

[display]
# Status display on the shield: 0.96" 128x64 I2C OLED (SSD1306).
# "ssd1306", "console" (log only) or "none".
backend=ssd1306
# [TO VERIFY] Bus and address. The module selects 0x3C or 0x3D with a
# resistor on its back ("IIC address select 0x78/0x7A" in 8-bit notation).
i2c_bus=1
address=0x3C

[ui]
fullscreen=true
# es, en or fr
language=es
state=/var/lib/clorela/ui.conf
