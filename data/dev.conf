# Development configuration for a desktop PC: simulated node, no hardware,
# everything under ./run-dev/ (relative to the working directory).
#   clorela-acqd --config data/dev.conf
#   clorela-ui   --config data/dev.conf --windowed

[storage]
database=run-dev/measurements.db

[acquisition]
sensor=sim
node_addresses="0x10"
interval_s=10
leds="0-11"
require_network=false
autostart=true
control_socket=run-dev/acqd.sock

[display]
backend=console

[ui]
fullscreen=false
language=es
state=run-dev/ui.conf
