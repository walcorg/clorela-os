# Clorela-OS build definition for kas (https://kas.readthedocs.io).
#
#   kas build kas/clorela.yml                     # plain build
#   kas build kas/clorela.yml:kas/r710.yml        # with the R710 resource limits
#
# Every layer is pinned to a commit so the same inputs always give the same
# image. To move to newer layers, update the commit ids together and note it
# in CHANGES.md.
#
# The URLs are the GitHub mirrors of the canonical repositories
# (git.yoctoproject.org, git.openembedded.org, code.qt.io); the commits are
# the same in both.

header:
  version: 14

distro: clorela
machine: raspberrypi0-wifi
target: clorela-image

repos:
  # This repository: provides meta-clorela.
  clorela-os:
    layers:
      meta-clorela:

  poky:
    url: https://github.com/yoctoproject/poky
    branch: scarthgap
    # Yocto Project 5.0 "Scarthgap" (LTS), stable branch after 5.0.20, 2026-10-19.
    commit: 104772c5fd0653290cbb5e4b77813343957939cc
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    commit: 0f00f8b9a21950640da8c5707343e5540133f86e # 2026-09-29
    layers:
      meta-oe:
      meta-python:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: scarthgap
    commit: 018d44467c4f09eb63f8ea5e86e85d755250cf89 # 2026-10-08

  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.8"
    # Qt 6.8 (open-source branch). Compatible with scarthgap.
    commit: 7debcef4c81603de404e48e4f0150c0ed5b21349 # 2026-10-19

local_conf_header:
  clorela: |
    # Keep downloads and shared state outside the build directory so they
    # survive `rm -rf build` and can be shared between builds.
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
    # Remove work directories after each recipe builds: saves a lot of disk.
    INHERIT += "rm_work"
    # Stop the build before the disk fills up.
    BB_DISKMON_DIRS ??= "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K"
