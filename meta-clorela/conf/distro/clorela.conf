# Clorela-OS distribution, based on Poky (Yocto Project 5.0 "Scarthgap").
require conf/distro/poky.conf

DISTRO = "clorela"
DISTRO_NAME = "Clorela-OS"
DISTRO_VERSION = "0.1.0"
MAINTAINER = "WALCORG <walcorg@gmail.com>"

# systemd as init (also enables usrmerge).
INIT_MANAGER = "systemd"

# A headless-style node with one full-screen Qt application on the
# framebuffer: no X11, Wayland or GPU stack. This keeps the image small and
# the Qt build much shorter on the build server.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan bluetooth 3g nfc nfs zeroconf pulseaudio ptest"
DISTRO_FEATURES:append = " wifi"

# Raspberry Pi: legacy firmware framebuffer instead of the VC4 KMS driver.
# psplash and Qt (linuxfb) draw on /dev/fb0, and config.txt hdmi_group /
# hdmi_mode set the resolution (1920x1080, see rpi-config bbappend).
DISABLE_VC4GRAPHICS = "1"

# Raspberry Pi Zero W Wi-Fi firmware is shipped under this license flag.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Qt: SQLite driver for the measurement database (linuxfb is on by default
# when OpenGL is disabled).
PACKAGECONFIG_DISTRO:pn-qtbase = "sql-sqlite"

# Overlay used by config.txt for the TROPIC01 chip select (not deployed by
# default; i2c-gpio and dwc2 already are).
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/spi0-1cs.dtbo"

# Load the I2C and SPI user-space drivers at boot.
KERNEL_MODULE_AUTOLOAD += "i2c-dev spidev"

hostname:pn-base-files = "clorela"
