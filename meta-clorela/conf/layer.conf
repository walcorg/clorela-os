# meta-clorela: Yocto layer for Clorela-OS, the WALCORG photobioreactor node.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "clorela"
BBFILE_PATTERN_clorela = "^${LAYERDIR}/"
BBFILE_PRIORITY_clorela = "10"

LAYERVERSION_clorela = "1"
LAYERSERIES_COMPAT_clorela = "scarthgap"
LAYERDEPENDS_clorela = "core raspberrypi qt6-layer openembedded-layer"

# The layer lives inside the clorela-os repository; the application recipe
# builds the sources next to it (see recipes-clorela/clorela-apps/clorela-apps_0.1.0.bb).
# ":=" expands now, while LAYERDIR is still defined.
CLORELA_SRC_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..'))}"
